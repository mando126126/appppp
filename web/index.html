<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkaufs-Anker</title>
<meta name="description" content="Wochenliste, Vorrat und Verschwendung im Blick — gerechnet aus den eigenen Bons, ohne Konto und ohne Server.">

<!-- Als App installierbar: Vollbild ohne Browserleiste, eigenes Symbol -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Anker">
<meta name="theme-color" content="#F4F5F7">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<!-- Die Schrift vorziehen. Ohne diese Zeile findet der Browser sie erst,
     nachdem er app.css gelesen hat — der Text steht dann kurz in der
     Systemschrift und springt danach um. `crossorigin` ist auch bei
     eigener Herkunft Pflicht: Schriften werden anonym geholt, und ohne
     das Attribut lädt der Browser die Datei ein zweites Mal. -->
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">
  <nav class="nav" id="nav" aria-label="Hauptbereiche"></nav>
  <div class="col">
    <header class="appbar" id="appbar"></header>
    <div class="largeTitle" id="largeTitle"></div>
    <main id="main"></main>
  </div>
</div>

<!-- Ladenmodus: Vollbild, große Ziele, eine Hand -->
<!-- Diese Ansicht hieß an vier Stellen anders: der Knopf sagte „Nach
     Gängen“, die Überschrift „Im Laden“, die Vorlesehilfe
     „Ladenmodus“, die Einstellung „Ladenweg“. Wer hier landet, muss
     denselben Namen wiederfinden, den er angetippt hat. -->
<div class="store" id="store" hidden role="dialog" aria-label="Nach Gängen">
  <div class="storeTop">
    <h2>Nach Gängen</h2>
    <span class="prog num" id="storeProg">0 von 0</span>
    <button class="close" id="storeClose">Fertig</button>
  </div>
  <div class="storeBody" id="storeBody"></div>
  <div class="storeFoot">
    <div>
      <div class="stat">im Wagen</div>
      <div class="sum" id="storeSum">0,00 €</div>
    </div>
    <button class="cta" id="storeDone">Einkauf buchen</button>
  </div>
</div>

<!-- Aktionsblatt für Schritte, die sich nicht zurücknehmen lassen -->
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheetBody">
    <div class="grabber"></div>
    <div class="sheetTitle" id="sheetTitle"></div>
    <div class="sheetSub" id="sheetSub"></div>
    <div id="sheetOpts"></div>
    <button class="cta light" id="sheetCancel">Abbrechen</button>
  </div>
</div>

<!-- Erreichter Meilenstein: eigener Vollbild-Auftritt, nicht das
     nüchterne Blatt. Ein Moment, der die Mühe würdigt — die Zahl
     darin ist trotzdem die echte. -->
<div class="party" id="party" hidden role="dialog" aria-modal="true" aria-labelledby="partyTitle">
  <div class="partyGlow" id="partyGlow" aria-hidden="true"></div>
  <div class="partyBurst" id="partyBurst" aria-hidden="true"></div>
  <div class="partyCard" id="partyCard">
    <div class="partyKicker" id="partyKicker">Geschafft</div>
    <div class="partyMark" id="partyMark" aria-hidden="true"></div>
    <div class="partyNum" id="partyNum"></div>
    <h2 class="partyTitle" id="partyTitle"></h2>
    <div class="partyLevel" id="partyLevel"></div>
    <div class="partyPips" id="partyPips" aria-hidden="true"></div>
    <p class="partyNote" id="partyNote"></p>
    <button class="cta" id="partyGo">Weiter</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>window.__BUILD__ = "yuqcrl";</script>

<!-- Algorithmen: gebündelt aus src/algo, nicht von Hand abgeschrieben -->
<script src="bundle.js"></script>
<!-- Sicherung: dauerhafter Speicher, Schattenkopie, Datei -->
<script src="backup.js"></script>
<!-- Zweite Stufe für unbekannte Bon-Namen: Open Food Facts als Übersetzer,
     nie als Quelle für Haltbarkeit oder Sicherheit -->
<script src="offLookup.js"></script>
<!-- Speicher und Berechnung -->
<script src="data.js"></script>
<!-- Bild lesen (lädt Tesseract erst beim ersten Foto nach) -->
<script src="ocr.js"></script>
<!-- Ansichten und Rahmen -->
<script src="views.js"></script>
<script src="app.js"></script>
</body>
</html>
