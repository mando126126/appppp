<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KittiCatch ✨</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      touch-action: none;
      background: #0a0118;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      padding: 8px 8px 6px;
    }

    /* ── Header ── */
    #header {
      text-align: center;
      flex-shrink: 0;
    }
    #title {
      font-size: clamp(22px, 5.5vw, 38px);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #ff9de2 0%, #c77dff 50%, #ff9de2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 12px rgba(255,105,180,0.7));
    }
    #score-line {
      margin-top: 3px;
      color: #d4aaff;
      font-size: clamp(13px, 3vw, 18px);
      letter-spacing: 1px;
    }

    /* ── Canvas Wrapper ── */
    #canvas-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    #gameCanvas {
      display: block;
      border-radius: 16px;
      border: 2px solid rgba(199, 125, 255, 0.45);
      box-shadow:
        0 0 30px rgba(199,125,255,0.25),
        0 0 60px rgba(255,105,180,0.12),
        inset 0 0 30px rgba(0,0,0,0.6);
    }

    /* ── UwU Popup ── */
    #uwu-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: clamp(28px, 8vw, 52px);
      font-weight: 900;
      color: #ff9de2;
      filter: drop-shadow(0 0 16px #ff69b4) drop-shadow(0 0 32px #c77dff);
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
      z-index: 20;
      transition: none;
    }
    #uwu-popup.pop {
      animation: uwuAnim 1.6s ease-out forwards;
    }
    @keyframes uwuAnim {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
      18%  { opacity: 1; transform: translate(-50%, -55%) scale(1.25); }
      55%  { opacity: 1; transform: translate(-50%, -60%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -75%) scale(0.85); }
    }

    /* ── Controls ── */
    #controls {
      flex-shrink: 0;
      display: grid;
      grid-template-areas: ". up ." "left down right";
      gap: 7px;
      padding: 4px 0;
    }
    .btn {
      width:  clamp(58px, 16vw, 82px);
      height: clamp(58px, 16vw, 82px);
      background: rgba(45, 10, 80, 0.85);
      border: 2px solid rgba(199, 125, 255, 0.55);
      border-radius: 16px;
      color: #e0b3ff;
      font-size: clamp(24px, 6.5vw, 36px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.08s, transform 0.08s, box-shadow 0.08s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      touch-action: none;
    }
    .btn:active { background: rgba(120, 40, 180, 0.85); transform: scale(0.91); box-shadow: 0 0 14px rgba(199,125,255,0.6); }
    #btn-up    { grid-area: up; }
    #btn-left  { grid-area: left; }
    #btn-down  { grid-area: down; }
    #btn-right { grid-area: right; }
  </style>
</head>
<body>

<div id="header">
  <div id="title">🐱 KittiCatch ✨</div>
  <div id="score-line">🐟 Score: <span id="sc">0</span> &nbsp;·&nbsp; 🌟 Leckerlis: <span id="lc">0</span></div>
</div>

<div id="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
  <div id="uwu-popup">UwU~ ♡</div>
</div>

<div id="controls">
  <button class="btn" id="btn-up">↑</button>
  <button class="btn" id="btn-left">←</button>
  <button class="btn" id="btn-down">↓</button>
  <button class="btn" id="btn-right">→</button>
</div>

<script>
// ═══════════════════════════════════════════════
//  KITTI CATCH  ·  Canvas Game
// ═══════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

// ── Sizing ──────────────────────────────────────
const COLS = 20, ROWS = 20;
let CELL = 24, W = 480, H = 480;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const maxW = wrap.clientWidth  - 4;
  const maxH = wrap.clientHeight - 4;
  const size = Math.min(maxW, maxH, 540);
  CELL = Math.max(14, Math.floor(size / COLS));
  W = COLS * CELL;
  H = ROWS * CELL;
  canvas.width  = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', () => { resize(); });

// ── Audio ────────────────────────────────────────
let aud = null;
function initAud() {
  if (!aud) aud = new (window.AudioContext || window.webkitAudioContext)();
  if (aud.state === 'suspended') aud.resume();
}
function tone(freq, dur, type='sine', vol=0.28, delay=0) {
  if (!aud) return;
  const o = aud.createOscillator(), g = aud.createGain();
  o.type = type;
  o.connect(g); g.connect(aud.destination);
  const t = aud.currentTime + delay;
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
function playCollect() {
  tone(880, 0.10, 'sine', 0.22);
  tone(1320, 0.08, 'sine', 0.14, 0.08);
}
function playUwu() {
  // cute ascending jingle ♪
  [523, 659, 784, 988, 1175, 1319].forEach((f, i) => tone(f, 0.20, 'sine', 0.32, i * 0.12));
  // cute little tinkle on top
  [2093, 2637].forEach((f, i) => tone(f, 0.15, 'sine', 0.18, 0.75 + i * 0.1));
}

// ── State ────────────────────────────────────────
const BIG_EVERY = 5;   // big treat every N collects

let cat = {
  x: Math.floor(COLS/2), y: Math.floor(ROWS/2),
  dir: 'right', next: 'right',
  happy: 0,           // > 0 → draw ^w^ eyes
  eatAnim: 0          // scale bump when eating
};
let treats   = [];
let bigTreat = null;
let score    = 0;
let collected= 0;
let particles= [];
let trail    = [];

// Background stars (static grid positions, pre-computed)
const stars = Array.from({ length: 55 }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.4 + 0.4,
  phase: Math.random() * Math.PI * 2
}));

// ── Treat Helpers ────────────────────────────────
function occupied(x, y) {
  if (x === cat.x && y === cat.y) return true;
  if (bigTreat && bigTreat.x === x && bigTreat.y === y) return true;
  return treats.some(t => t.x === x && t.y === y);
}
function freeCell() {
  let x, y, tries = 0;
  do { x = Math.floor(Math.random()*COLS); y = Math.floor(Math.random()*ROWS); }
  while (occupied(x,y) && ++tries < 300);
  return { x, y };
}
function spawnTreats() {
  while (treats.length < 28) {
    const {x,y} = freeCell();
    treats.push({ x, y, wobble: Math.random()*Math.PI*2 });
  }
}
function spawnBig() {
  const {x,y} = freeCell();
  bigTreat = { x, y, pulse: 0, spin: 0 };
}

spawnTreats();

// ── Drawing Helpers ──────────────────────────────
function drawBg() {
  ctx.fillStyle = '#08010f';
  ctx.fillRect(0, 0, W, H);

  // subtle vignette
  const vig = ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0,0,W,H);

  // twinkling stars
  const t = Date.now()/1000;
  stars.forEach(s => {
    const b = 0.35 + 0.65 * Math.abs(Math.sin(s.phase + t * (0.4 + s.r*0.3)));
    ctx.fillStyle = `rgba(220,190,255,${b})`;
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
    ctx.fill();
  });

  // faint grid
  ctx.strokeStyle = 'rgba(70,20,110,0.28)';
  ctx.lineWidth = 0.6;
  for (let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,H); ctx.stroke(); }
  for (let j=0;j<=ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(W,j*CELL); ctx.stroke(); }
}

// small fish treat
function drawTreat(t) {
  t.wobble += 0.045;
  const cx = t.x*CELL + CELL/2;
  const cy = t.y*CELL + CELL/2 + Math.sin(t.wobble)*1.8;
  const r  = CELL * 0.21;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.shadowColor = '#ff9944'; ctx.shadowBlur = 7;
  // body
  ctx.fillStyle = '#ffbb44';
  ctx.beginPath(); ctx.ellipse(0,0,r*1.35,r*0.78,0,0,Math.PI*2); ctx.fill();
  // tail
  ctx.beginPath();
  ctx.moveTo(r*1.2,0); ctx.lineTo(r*2.1,-r*0.72); ctx.lineTo(r*2.1,r*0.72);
  ctx.closePath(); ctx.fill();
  // fin on top
  ctx.fillStyle = '#ffcc66';
  ctx.beginPath();
  ctx.moveTo(-r*0.2,-r*0.72); ctx.lineTo(-r*0.5,-r*1.3); ctx.lineTo(r*0.3,-r*0.72);
  ctx.closePath(); ctx.fill();
  // eye
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#1a0828';
  ctx.beginPath(); ctx.arc(-r*0.52,-r*0.08,r*0.2,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(-r*0.58,-r*0.15,r*0.07,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// big golden treat
function drawBigTreat(b) {
  b.pulse += 0.055;
  b.spin  += 0.025;
  const sc = 1 + 0.13*Math.sin(b.pulse);
  const cx = b.x*CELL + CELL/2;
  const cy = b.y*CELL + CELL/2;
  const r  = CELL*0.40*sc;
  ctx.save();
  ctx.translate(cx, cy);

  // outer halo
  const halo = ctx.createRadialGradient(0,0,0,0,0,r*3);
  halo.addColorStop(0,'rgba(255,215,0,0.38)');
  halo.addColorStop(0.5,'rgba(255,180,0,0.12)');
  halo.addColorStop(1,'rgba(255,150,0,0)');
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(0,0,r*3,0,Math.PI*2); ctx.fill();

  // rotating sparkle ring
  ctx.rotate(b.spin);
  for(let i=0;i<6;i++){
    const a = (i/6)*Math.PI*2;
    ctx.fillStyle = 'rgba(255,240,80,0.9)';
    ctx.font = `${r*0.5}px Arial`;
    const ex = Math.cos(a)*r*2.1, ey = Math.sin(a)*r*2.1;
    ctx.fillText('✦', ex - r*0.15, ey + r*0.15);
  }
  ctx.rotate(-b.spin);

  // main fish (golden, big)
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.ellipse(0,0,r*1.45,r*0.88,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r*1.3,0); ctx.lineTo(r*2.25,-r*0.85); ctx.lineTo(r*2.25,r*0.85);
  ctx.closePath(); ctx.fill();
  // dorsal fin
  ctx.fillStyle = '#ffe040';
  ctx.beginPath();
  ctx.moveTo(-r*0.15,-r*0.85); ctx.lineTo(-r*0.55,-r*1.5); ctx.lineTo(r*0.35,-r*0.85);
  ctx.closePath(); ctx.fill();
  // shine
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,255,255,0.38)';
  ctx.beginPath(); ctx.ellipse(-r*0.18,-r*0.22,r*0.52,r*0.25,-0.4,0,Math.PI*2); ctx.fill();
  // eye
  ctx.fillStyle = '#1a0828';
  ctx.beginPath(); ctx.arc(-r*0.55,-r*0.1,r*0.22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='white';
  ctx.beginPath(); ctx.arc(-r*0.63,-r*0.18,r*0.09,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// anime cat  ♡
function drawCat() {
  // trail
  trail.forEach((p,i) => {
    const frac = (i+1)/trail.length;
    ctx.save();
    ctx.globalAlpha = frac * 0.22;
    ctx.fillStyle = '#c77dff';
    ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(p.x*CELL+CELL/2, p.y*CELL+CELL/2, CELL*0.12*frac, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  const cx = cat.x*CELL + CELL/2;
  const cy = cat.y*CELL + CELL/2;
  const eatS = 1 + 0.12 * Math.sin(cat.eatAnim * 0.4);
  const r  = CELL * 0.43 * (cat.eatAnim > 0 ? eatS : 1);
  if (cat.eatAnim > 0) cat.eatAnim--;

  const isHappy = cat.happy > 0;
  if (isHappy) cat.happy--;

  ctx.save();
  ctx.translate(cx, cy);

  // glow
  ctx.shadowColor = '#ff9de2'; ctx.shadowBlur = 14;

  // body
  ctx.fillStyle = '#fff3fb';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // ears (always upward)
  const eTipX = r*0.78, eTipY = -(r*1.28);
  ctx.fillStyle = '#fff3fb';
  // left
  ctx.beginPath(); ctx.moveTo(-r*0.22,-r*0.82); ctx.lineTo(-eTipX,eTipY); ctx.lineTo(-r*0.06,-r*0.9); ctx.closePath(); ctx.fill();
  // right
  ctx.beginPath(); ctx.moveTo(r*0.22,-r*0.82); ctx.lineTo(eTipX,eTipY); ctx.lineTo(r*0.06,-r*0.9); ctx.closePath(); ctx.fill();
  // inner ears (pink)
  ctx.fillStyle = '#ffb3cc';
  ctx.beginPath(); ctx.moveTo(-r*0.21,-r*0.84); ctx.lineTo(-r*0.66,eTipY*0.85); ctx.lineTo(-r*0.1,-r*0.9); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(r*0.21,-r*0.84); ctx.lineTo(r*0.66,eTipY*0.85); ctx.lineTo(r*0.1,-r*0.9); ctx.closePath(); ctx.fill();

  // ── eyes ──
  if (isHappy) {
    // ^w^ arcs
    ctx.strokeStyle = '#2d0050'; ctx.lineWidth = r*0.13; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-r*0.3,-r*0.1,r*0.22,Math.PI,0); ctx.stroke();
    ctx.beginPath(); ctx.arc( r*0.3,-r*0.1,r*0.22,Math.PI,0); ctx.stroke();
    // little sparkles beside happy eyes
    ctx.fillStyle = '#ffe0f7'; ctx.font = `${r*0.35}px Arial`;
    ctx.fillText('✦', -r*0.65,-r*0.38);
    ctx.fillText('✦',  r*0.42,-r*0.38);
  } else {
    // big anime eyes
    ctx.fillStyle = '#1e0040';
    ctx.beginPath(); ctx.ellipse(-r*0.3,-r*0.1,r*0.21,r*0.27,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( r*0.3,-r*0.1,r*0.21,r*0.27,0,0,Math.PI*2); ctx.fill();
    // pupil highlight (big)
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(-r*0.37,-r*0.21,r*0.08,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( r*0.23,-r*0.21,r*0.08,0,Math.PI*2); ctx.fill();
    // pupil highlight (small)
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(-r*0.26,-r*0.03,r*0.04,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( r*0.34,-r*0.03,r*0.04,0,Math.PI*2); ctx.fill();
  }

  // nose (tiny pink triangle)
  ctx.fillStyle = '#ff9de2';
  ctx.beginPath(); ctx.moveTo(0,r*0.12); ctx.lineTo(-r*0.09,r*0.22); ctx.lineTo(r*0.09,r*0.22); ctx.closePath(); ctx.fill();

  // mouth (cute w-shape / smile)
  ctx.strokeStyle = '#cc5588'; ctx.lineWidth = r*0.065; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const mDip = isHappy ? r*0.46 : r*0.38;
  ctx.beginPath();
  ctx.moveTo(-r*0.24, r*0.3);
  ctx.quadraticCurveTo(-r*0.08, mDip, 0, r*0.3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(0, r*0.3);
  ctx.quadraticCurveTo(r*0.08, mDip, r*0.24, r*0.3);
  ctx.stroke();

  // whiskers
  ctx.strokeStyle = 'rgba(180,130,200,0.65)'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  [[-r*0.14,r*0.08,-r*0.88,-r*0.02],[-r*0.14,r*0.19,-r*0.88,r*0.26],
   [ r*0.14,r*0.08, r*0.88,-r*0.02],[ r*0.14,r*0.19, r*0.88,r*0.26]].forEach(([sx,sy,ex,ey])=>{
    ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
  });

  // blush
  ctx.fillStyle = 'rgba(255,120,160,0.28)';
  ctx.beginPath(); ctx.ellipse(-r*0.52,r*0.07,r*0.22,r*0.12,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse( r*0.52,r*0.07,r*0.22,r*0.12,0,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// ── Particles ────────────────────────────────────
function addParticles(gx, gy, big) {
  const cx = gx*CELL+CELL/2, cy = gy*CELL+CELL/2;
  const chars  = big ? ['✨','⭐','💖','🌟','♡','★','✦'] : ['✦','♡','·','~','✿'];
  const colors = big ? ['#ffd700','#ff9de2','#fff','#c77dff'] : ['#ff9de2','#d4aaff','#fff0f8'];
  const count  = big ? 14 : 5;
  for (let i=0;i<count;i++) {
    const a = Math.random()*Math.PI*2;
    const sp = (Math.random()*3+1.5)*(big?2.2:1);
    particles.push({
      x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(big?2.5:1),
      char: chars[Math.floor(Math.random()*chars.length)],
      color: colors[Math.floor(Math.random()*colors.length)],
      size: big ? (Math.random()*18+14) : (Math.random()*10+8),
      life: big?60:38, max:big?60:38, g:0.14
    });
  }
}
function tickParticles() {
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; });
}
function drawParticles() {
  particles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha = Math.pow(p.life/p.max, 0.7);
    ctx.font = `${p.size}px Arial`;
    ctx.fillStyle = p.color;
    ctx.fillText(p.char, p.x-p.size*0.4, p.y+p.size*0.35);
    ctx.restore();
  });
}

// ── UwU Popup ────────────────────────────────────
const uwuEl = document.getElementById('uwu-popup');
function showUwu() {
  uwuEl.classList.remove('pop');
  void uwuEl.offsetWidth;
  uwuEl.classList.add('pop');
  setTimeout(()=>uwuEl.classList.remove('pop'), 1700);
}

// ── Score ─────────────────────────────────────────
function updateHUD() {
  document.getElementById('sc').textContent = score;
  document.getElementById('lc').textContent = collected;
}

// ── Movement ─────────────────────────────────────
function step() {
  cat.dir = cat.next;
  const moves = { right:[1,0], left:[-1,0], down:[0,1], up:[0,-1] };
  const [dx,dy] = moves[cat.dir];
  const nx = (cat.x+dx+COLS)%COLS;
  const ny = (cat.y+dy+ROWS)%ROWS;

  // trail
  trail.unshift({x:cat.x, y:cat.y});
  if(trail.length>6) trail.pop();

  cat.x=nx; cat.y=ny;

  // small treat?
  const ti = treats.findIndex(t=>t.x===cat.x && t.y===cat.y);
  if(ti!==-1){
    treats.splice(ti,1);
    score+=10; collected++;
    cat.happy=22; cat.eatAnim=18;
    addParticles(cat.x,cat.y,false);
    playCollect();
    updateHUD();
    if(collected%BIG_EVERY===0 && !bigTreat) spawnBig();
    if(treats.length<18) spawnTreats();
  }

  // big treat?
  if(bigTreat && bigTreat.x===cat.x && bigTreat.y===cat.y){
    score+=50;
    cat.happy=70; cat.eatAnim=35;
    addParticles(cat.x,cat.y,true);
    playUwu(); showUwu();
    bigTreat=null;
    updateHUD();
  }
}

// ── Direction ────────────────────────────────────
function setDir(d) {
  initAud();
  const opp = {right:'left',left:'right',up:'down',down:'up'};
  if(d!==opp[cat.dir]) cat.next=d;
}

// ── Controls ──────────────────────────────────────
[['btn-up','up'],['btn-down','down'],['btn-left','left'],['btn-right','right']].forEach(([id,dir])=>{
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();setDir(dir);},{passive:false});
  el.addEventListener('mousedown',()=>setDir(dir));
});
document.addEventListener('keydown',e=>{
  const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
  if(m[e.key]){e.preventDefault();setDir(m[e.key]);}
});

// swipe on canvas
let sx=0,sy=0;
canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
  Math.abs(dx)>Math.abs(dy) ? setDir(dx>0?'right':'left') : setDir(dy>0?'down':'up');
  e.preventDefault();
},{passive:false});

// ── Game Loop ─────────────────────────────────────
let lastStep=0;
function speed(){ return Math.max(85, 200 - Math.floor(collected/25)*18); }

function loop(ts){
  if(ts-lastStep >= speed()){
    step();
    lastStep=ts;
  }
  drawBg();
  treats.forEach(t=>drawTreat(t));
  if(bigTreat) drawBigTreat(bigTreat);
  tickParticles();
  drawCat();
  drawParticles();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
